[package]
authors = [
    "Andrew Korzhuev <korzhuev@andrusha.me>",
    "Will Eaton <me@wseaton.com>",
]
categories = ["api-bindings", "database"]
description = "snowflake-rs fork: cancellation, async, streaming, multi-statement, bind params, structured types, retry middleware"
documentation = "https://docs.rs/firn/"
edition = "2021"
keywords = ["snowflake", "database", "api", "arrow", "fork"]
license = "Apache-2.0"
name = "firn"
readme = "README.md"
repository = "https://github.com/wseaton/firn"
version = "0.15.0"

[features]
all = ["cert-auth", "polars", "browser-auth"]
cert-auth = ["dep:snowflake-jwt"]
browser-auth = ["dep:getrandom", "dep:urlencoding", "dep:open"]
default = ["cert-auth"]
# support for conversion of arrow and json payloads to dataframes
polars = ["dep:polars-core", "dep:polars-io"]

[dependencies]
arc-swap = "1"
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
http = "1"
log = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "gzip",
    "json",
    "rustls",
] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-retry = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snowflake-jwt = { version = "0.3", optional = true }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# polars-support
polars-core = { version = ">=0.41", optional = true }
polars-io = { version = ">=0.41", features = [
    "json",
    "ipc_streaming",
], optional = true }

# browser-auth support
getrandom = { version = "0.4", optional = true }
urlencoding = { version = "2", optional = true }
open = { version = "5", optional = true }

# put request support
glob = { version = "0.3" }
object_store = { version = "0.13", features = ["aws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }

[dev-dependencies]
anyhow = "1"
arrow = { version = "58", features = ["prettyprint"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
pretty_env_logger = "0.5"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
